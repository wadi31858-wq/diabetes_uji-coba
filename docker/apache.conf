<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy to Streamlit background server if enabled
    ProxyRequests Off
    ProxyPreserveHost On
    <Location /streamlit-embed/>
        ProxyPass http://127.0.0.1:8501/
        ProxyPassReverse http://127.0.0.1:8501/
    </Location>
    <Location /streamlit-embed/stream>
        ProxyPass ws://127.0.0.1:8501/stream
        ProxyPassReverse ws://127.0.0.1:8501/stream
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
